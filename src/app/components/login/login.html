<div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;">
  <div style="width: 90%; max-width: 400px; padding: 40px; background-color: white; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);">
    <h2 style="text-align: center; margin-bottom: 30px; color: #3f51b5; font-weight: 500;">
      Iniciar Sesión
    </h2>

    <form #loginForm="ngForm" (ngSubmit)="login(loginForm)" novalidate>
      <!-- USERNAME -->
      <mat-form-field appearance="outline" style="width: 100%; margin-bottom: 20px; display: block;">
        <mat-label>Usuario</mat-label>
        <input
          matInput
          type="text"
          [(ngModel)]="username"
          name="username"
          placeholder="Ingrese usuario"
          required
          minlength="3"
          #usernameCtrl="ngModel"
        />
        <mat-error *ngIf="usernameCtrl.errors?.['required'] && (usernameCtrl.touched || loginForm.submitted)">
          El usuario es obligatorio.
        </mat-error>
        <mat-error *ngIf="usernameCtrl.errors?.['minlength'] && (usernameCtrl.touched || loginForm.submitted)">
          Debe tener al menos 3 caracteres.
        </mat-error>
      </mat-form-field>

      <!-- PASSWORD -->
      <mat-form-field appearance="outline" style="width: 100%; margin-bottom: 20px; display: block;">
        <mat-label>Contraseña</mat-label>
        <input
          matInput
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Ingrese contraseña"
          required
          minlength="6"
          #passwordCtrl="ngModel"
        />
        <mat-error *ngIf="passwordCtrl.errors?.['required'] && (passwordCtrl.touched || loginForm.submitted)">
          La contraseña es obligatoria.
        </mat-error>
        <mat-error *ngIf="passwordCtrl.errors?.['minlength'] && (passwordCtrl.touched || loginForm.submitted)">
          Debe tener mínimo 6 caracteres.
        </mat-error>
      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        type="submit"
        style="width: 100%; height: 48px; font-size: 16px; font-weight: 500; margin-top: 10px;"
      >
        Iniciar sesión
      </button>
    </form>
  </div>
</div>
